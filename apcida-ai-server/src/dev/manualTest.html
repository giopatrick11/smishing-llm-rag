<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ApCiDa manual AI test</title>
</head>
<body>
  <main>
    <h1>ApCiDa manual AI test</h1>
    <p>Development only. Enter synthetic SMS text. This page cannot read your inbox.</p>
    <p>The API key and message stay in this tab until you clear them or close it. Use only trusted Wi-Fi.</p>
    <label for="key">Development API key</label><br>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" size="32"><br><br>
    <label for="sms">Synthetic SMS</label><br>
    <textarea id="sms" rows="6" cols="35" maxlength="2000" autocomplete="off"></textarea><br>
    <label><input id="synthetic" type="checkbox"> I confirm this message is synthetic</label><br><br>
    <button id="analyze" type="button">Analyze on remote AI server</button>
    <button id="clear" type="button">Clear</button>
    <p id="status" role="status" aria-live="polite">No analysis yet.</p>
    <section id="result" aria-live="polite"></section>
  </main>
  <script src="/manual-test.js" defer></script>
</body>
</html>
